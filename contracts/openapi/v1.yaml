openapi: 3.1.0
info:
  title: RideJaunm API
  version: 1.0.0-draft
  description: |
    Contract foundation for the Nepal-first RideJaunm pilot. All protected endpoints
    enforce server-side resource authorization and a resolved country capability profile.
servers:
  - url: https://api.example.invalid/v1
security:
  - bearerAuth: []
paths:
  /devices:
    post:
      operationId: registerDevice
      summary: Register safe device metadata for authenticated user
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeviceCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/DeviceSessionResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /me:
    get:
      operationId: getCurrentUser
      summary: Retrieve current authenticated user profile
      responses:
        '200': { $ref: '#/components/responses/CurrentUser' }
        '401': { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateCurrentUser
      summary: Update current user safe profile metadata
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCurrentUserCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/CurrentUser' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '412': { $ref: '#/components/responses/ApiError' }
  /me/device-sessions:
    get:
      operationId: listDeviceSessions
      summary: List authenticated user device sessions
      responses:
        '200': { $ref: '#/components/responses/DeviceSessionList' }
        '401': { $ref: '#/components/responses/ApiError' }
  /me/device-sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    delete:
      operationId: revokeDeviceSession
      summary: Revoke an active device session
      responses:
        '204': { description: Session revoked successfully }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /me/consents:
    get:
      operationId: listConsentReceipts
      summary: List user immutable consent receipts
      responses:
        '200': { $ref: '#/components/responses/ConsentList' }
        '401': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: recordConsentDecision
      summary: Record immutable grant or revoke consent fact
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentDecisionCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/ConsentReceipt' }
        '201': { $ref: '#/components/responses/ConsentReceipt' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /me/safety-profile:
    get:
      operationId: getSafetyProfile
      summary: Get safe safety profile summary
      responses:
        '200': { $ref: '#/components/responses/SafetyProfileResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    put:
      operationId: updateSafetyProfile
      summary: Update safe safety profile summary
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSafetyProfileCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/SafetyProfileResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '412': { $ref: '#/components/responses/ApiError' }
  /trips:
    post:
      operationId: createTrip
      summary: Create a durable private trip draft
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTripCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/TripResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /trips/{tripId}:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    get:
      operationId: getTrip
      summary: Read owner or member visible trip
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
    put:
      operationId: updateTrip
      summary: Update trip attributes with optimistic locking
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTripCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '412': { $ref: '#/components/responses/ApiError' }
  /trips/{tripId}/start:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    post:
      operationId: startTrip
      summary: Transition trip to active and start ride fact
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/RideResponse' }
        '201': { $ref: '#/components/responses/RideResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /trips/{tripId}/complete:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    post:
      operationId: completeTrip
      summary: Complete trip and associated active ride
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /groups:
    post:
      operationId: createGroup
      summary: Create a private group and assign creator as owner
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGroupCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/GroupResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /groups/{groupId}:
    parameters: [{ $ref: '#/components/parameters/GroupId' }]
    get:
      operationId: getGroup
      summary: Read group summary (requires active membership)
      responses:
        '200': { $ref: '#/components/responses/GroupResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /groups/{groupId}/invites:
    parameters: [{ $ref: '#/components/parameters/GroupId' }]
    post:
      operationId: createGroupInvite
      summary: Create an expiring opaque group invite (owner or admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGroupInviteCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/GroupInviteResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /group-invites/{inviteId}/accept:
    parameters: [{ $ref: '#/components/parameters/InviteId' }]
    post:
      operationId: acceptGroupInvite
      summary: Accept group invite with token and become an active member
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptGroupInviteCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/GroupMembershipResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /group-invites/{inviteId}/revoke:
    parameters: [{ $ref: '#/components/parameters/InviteId' }]
    post:
      operationId: revokeGroupInvite
      summary: Revoke an active group invite by owner or admin
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/GroupInviteResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /groups/{groupId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/GroupId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      operationId: updateGroupMembership
      summary: Update member role or leave/remove member
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGroupMembershipCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/GroupMembershipResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '412': { $ref: '#/components/responses/ApiError' }
  /rides/{rideId}:
    parameters: [{ $ref: '#/components/parameters/RideId' }]
    get:
      operationId: getRide
      summary: Get ride summary (requires trip owner or group member)
      responses:
        '200': { $ref: '#/components/responses/RideResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /geo/sources:
    post:
      operationId: registerGeoSource
      summary: Register a geospatial source with licensing and review state (geo_admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGeoSourceCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/GeoSourceResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /geo/sources/{sourceId}/review:
    parameters: [{ $ref: '#/components/parameters/GeoSourceId' }]
    post:
      operationId: reviewGeoSource
      summary: Review and approve or reject a geospatial source (geo_admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewGeoSourceCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/GeoSourceResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /geo/datasets:
    post:
      operationId: ingestGeoDataset
      summary: Ingest and validate a synthetic geographic dataset (geo_admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IngestGeoDatasetCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/GeoDatasetResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /geo/datasets/{datasetId}/review:
    parameters: [{ $ref: '#/components/parameters/GeoDatasetId' }]
    post:
      operationId: reviewGeoDataset
      summary: Review and approve or reject an ingested geographic dataset (geo_admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewGeoDatasetCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/GeoDatasetResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /geo/graphs:
    post:
      operationId: createGraphVersion
      summary: Create an immutable graph version pinning reviewed datasets (geo_admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGraphVersionCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/GraphVersionResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /geo/graphs/{graphId}/publish:
    parameters: [{ $ref: '#/components/parameters/GraphId' }]
    post:
      operationId: publishGraphVersion
      summary: Atomically publish an approved graph version and emit graph.published.v1 (geo_admin only)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/GraphVersionResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /geo/graphs/{graphId}:
    parameters: [{ $ref: '#/components/parameters/GraphId' }]
    get:
      operationId: getGraphVersion
      summary: Get graph version status and provenance metadata
      responses:
        '200': { $ref: '#/components/responses/GraphVersionResponse' }
        '404': { $ref: '#/components/responses/ApiError' }
  /geo/graphs/active:
    get:
      operationId: getActiveGraphVersion
      summary: Get current active published graph version for country
      parameters:
        - name: countryCode
          in: query
          required: false
          schema: { type: string, default: 'NP' }
      responses:
        '200': { $ref: '#/components/responses/GraphVersionResponse' }
        '404': { $ref: '#/components/responses/ApiError' }
  /geo/quarantine:
    get:
      operationId: listQuarantinedRecords
      summary: List quarantined ingestion records with safe diagnostic reason codes (geo_admin only)
      responses:
        '200': { $ref: '#/components/responses/QuarantineListResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /routes:candidates:
    post:
      operationId: calculateRouteCandidates
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteCandidatesCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/RouteCandidates' }
        '403': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /rides/{rideId}/presence:
    parameters: [{ $ref: '#/components/parameters/RideId' }]
    get:
      operationId: listRidePresence
      responses:
        '200': { $ref: '#/components/responses/PresenceList' }
    post:
      operationId: upsertRidePresence
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PresenceCommand' } } }
      responses:
        '200': { $ref: '#/components/responses/Presence' }
        '403': { $ref: '#/components/responses/ApiError' }
  /offline-packs:
    get:
      operationId: listOfflinePacks
      responses:
        '200': { $ref: '#/components/responses/OfflinePackList' }
  /offline-packs/{packId}/download-intents:
    parameters: [{ $ref: '#/components/parameters/PackId' }]
    post:
      operationId: createPackDownloadIntent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/DownloadIntent' }
        '403': { $ref: '#/components/responses/ApiError' }
  /safety-incidents:
    post:
      operationId: activateSafetyIncident
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActivateSafetyIncidentCommand' } } }
      responses:
        '201': { $ref: '#/components/responses/SafetyIncident' }
        '422': { $ref: '#/components/responses/ApiError' }
  /safety-incidents/{incidentId}:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    get:
      operationId: getSafetyIncident
      responses:
        '200': { $ref: '#/components/responses/SafetyIncident' }
        '404': { $ref: '#/components/responses/ApiError' }
  /configuration/effective:
    get:
      operationId: getEffectiveConfiguration
      responses:
        '200': { $ref: '#/components/responses/EffectiveConfiguration' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 256 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    TripId: { name: tripId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    GroupId: { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    InviteId: { name: inviteId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    RideId: { name: rideId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    PackId: { name: packId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    IncidentId: { name: incidentId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    GeoSourceId: { name: sourceId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    GeoDatasetId: { name: datasetId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    GraphId: { name: graphId, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
  schemas:
    OpaqueId: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    UtcInstant: { type: string, format: date-time, description: UTC RFC 3339 instant }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }
    CountryContext:
      type: object
      required: [code, configVersion]
      properties:
        code: { type: string, pattern: '^[A-Z]{2}$' }
        configVersion: { type: string }
    Meta:
      type: object
      required: [requestId, apiVersion, serverTime]
      properties:
        requestId: { type: string }
        apiVersion: { const: v1 }
        serverTime: { $ref: '#/components/schemas/UtcInstant' }
        countryProfile: { $ref: '#/components/schemas/CountryContext' }
    ErrorBody:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        details: { type: array, items: { type: object, properties: { field: { type: string }, code: { type: string }, message: { type: string } } } }
    User:
      type: object
      required: [id, accountState, locale, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        displayName: { type: string, maxLength: 60 }
        accountState: { enum: [active, suspended, deactivated] }
        locale: { type: string, example: ne-NP }
        version: { type: string }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    UpdateCurrentUserCommand:
      type: object
      properties:
        displayName: { type: string, maxLength: 60 }
        locale: { type: string, example: ne-NP }
    DeviceSession:
      type: object
      required: [id, platform, appVersion, state, createdAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        deviceLabel: { type: string, maxLength: 100 }
        platform: { enum: [ios, android] }
        appVersion: { type: string, maxLength: 30 }
        state: { enum: [active, revoked, expired] }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        lastUsedAt: { $ref: '#/components/schemas/UtcInstant' }
        revokedAt: { $ref: '#/components/schemas/UtcInstant' }
    RegisterDeviceCommand:
      type: object
      required: [platform, appVersion]
      properties:
        deviceLabel: { type: string, maxLength: 100 }
        platform: { enum: [ios, android] }
        appVersion: { type: string, maxLength: 30 }
        deviceFingerprint: { type: string, maxLength: 128 }
    ConsentReceipt:
      type: object
      required: [id, purpose, state, policyVersion, contentHash, locale, recordedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        purpose: { enum: [location_sharing, safety_profile, analytics, marketing] }
        state: { enum: [granted, revoked, expired] }
        policyVersion: { type: string }
        contentHash: { type: string }
        locale: { type: string }
        source: { type: string }
        recordedAt: { $ref: '#/components/schemas/UtcInstant' }
    ConsentDecisionCommand:
      type: object
      required: [purpose, decision, policyVersion, contentHash, locale]
      properties:
        purpose: { enum: [location_sharing, safety_profile, analytics, marketing] }
        decision: { enum: [grant, revoke] }
        policyVersion: { type: string }
        contentHash: { type: string }
        locale: { type: string }
    SafetyProfile:
      type: object
      required: [id, state, emergencyContactCount, medicalCardPresent, version, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        state: { enum: [enabled, disabled] }
        emergencyContactCount: { type: integer, minimum: 0 }
        medicalCardPresent: { type: boolean }
        version: { type: string }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    UpdateSafetyProfileCommand:
      type: object
      required: [state]
      properties:
        state: { enum: [enabled, disabled] }
        emergencyContactCount: { type: integer, maximum: 0, default: 0, description: Must be 0 in S3; protected contact storage is deferred }
        medicalCardPresent: { type: boolean, enum: [false], default: false, description: Must be false in S3; protected medical card storage is deferred }
    Trip:
      type: object
      required: [id, ownerId, state, country, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        ownerId: { $ref: '#/components/schemas/OpaqueId' }
        state: { enum: [draft, planned, active, completed, cancelled] }
        title: { type: string, maxLength: 120 }
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        selectedRouteCandidateId: { $ref: '#/components/schemas/OpaqueId' }
        groupId: { $ref: '#/components/schemas/OpaqueId' }
        plannedStartAt: { $ref: '#/components/schemas/UtcInstant' }
        country: { $ref: '#/components/schemas/CountryContext' }
        version: { type: string }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    CreateTripCommand:
      type: object
      required: [origin, destination]
      properties:
        title: { type: string, maxLength: 120 }
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        plannedStartAt: { $ref: '#/components/schemas/UtcInstant' }
        groupId: { $ref: '#/components/schemas/OpaqueId' }
    UpdateTripCommand:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        plannedStartAt: { $ref: '#/components/schemas/UtcInstant' }
        groupId: { $ref: '#/components/schemas/OpaqueId' }
    Group:
      type: object
      required: [id, name, visibility, creatorId, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string, minLength: 2, maxLength: 80 }
        visibility: { enum: [private, invite_only] }
        creatorId: { $ref: '#/components/schemas/OpaqueId' }
        version: { type: string }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    CreateGroupCommand:
      type: object
      required: [name, visibility]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        visibility: { enum: [private, invite_only] }
    GroupMembership:
      type: object
      required: [id, groupId, userId, role, state, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        groupId: { $ref: '#/components/schemas/OpaqueId' }
        userId: { $ref: '#/components/schemas/OpaqueId' }
        role: { enum: [owner, admin, member] }
        state: { enum: [active, removed, left] }
        version: { type: string }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    UpdateGroupMembershipCommand:
      type: object
      properties:
        role: { enum: [owner, admin, member] }
        state: { enum: [active, removed, left] }
    GroupInvite:
      type: object
      required: [id, groupId, creatorId, tokenStatus, expiresAt, state, createdAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        groupId: { $ref: '#/components/schemas/OpaqueId' }
        creatorId: { $ref: '#/components/schemas/OpaqueId' }
        inviteToken:
          type: string
          nullable: true
          description: Plaintext opaque invite token emitted strictly once upon initial creation. On idempotent replays, this field is null and tokenStatus is already_emitted.
        tokenStatus:
          type: string
          enum: [issued_once, already_emitted]
          description: State of the one-time secret token exposure.
        expiresAt: { $ref: '#/components/schemas/UtcInstant' }
        state: { enum: [pending, accepted, revoked, expired] }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
    CreateGroupInviteCommand:
      type: object
      required: [expiresInHours]
      properties:
        expiresInHours: { type: integer, minimum: 1, maximum: 720 }
    AcceptGroupInviteCommand:
      type: object
      required: [inviteToken]
      properties:
        inviteToken: { type: string, minLength: 16, maxLength: 128 }
    Ride:
      type: object
      required: [id, tripId, state, sharingState, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        tripId: { $ref: '#/components/schemas/OpaqueId' }
        groupId: { $ref: '#/components/schemas/OpaqueId' }
        state: { enum: [preparing, in_progress, paused, completed, cancelled] }
        sharingState: { enum: [off, active, stopped] }
        startedAt: { $ref: '#/components/schemas/UtcInstant' }
        completedAt: { $ref: '#/components/schemas/UtcInstant' }
        version: { type: string }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    RouteCandidateProvenance:
      type: object
      required: [graphVersionId, graphChecksum, configVersion, coverageReference, sourceVersion, datasetIds, generatedAt]
      properties:
        graphVersionId: { $ref: '#/components/schemas/OpaqueId' }
        graphChecksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        configVersion: { type: string }
        coverageReference: { type: string }
        sourceVersion: { type: string }
        datasetIds: { type: array, items: { $ref: '#/components/schemas/OpaqueId' } }
        generatedAt: { $ref: '#/components/schemas/UtcInstant' }
    RouteCandidate:
      type: object
      required: [id, profile, state, capabilityDeclaration, provenance]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        profile: { enum: [straight, curvy, supercurvy] }
        state: { enum: [available, restricted, unavailable] }
        distanceMeters: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        elevationGainMeters: { type: integer }
        curvatureScore: { type: number, minimum: 0, maximum: 100 }
        restrictionReasonCodes: { type: array, items: { type: string } }
        capabilityDeclaration: { type: string, enum: [synthetic_preview] }
        preview:
          type: object
          description: Non-navigable visual hint reference for preview only; never raw route geometry.
          properties:
            previewFixtureRef: { type: string }
            mode: { type: string, enum: [synthetic_preview] }
        provenance: { $ref: '#/components/schemas/RouteCandidateProvenance' }
    RouteCandidatesCommand:
      type: object
      required: [countryCode, configVersion, origin, destination, requestedProfiles]
      properties:
        countryCode: { type: string, minLength: 2, maxLength: 3, example: 'NP' }
        configVersion: { type: string, minLength: 2, maxLength: 32, example: 'v2026.1' }
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        waypointIds: { type: array, items: { $ref: '#/components/schemas/OpaqueId' }, maxItems: 12 }
        requestedProfiles:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { enum: [straight, curvy, supercurvy] }
    RouteCandidatesMeta:
      type: object
      required: [requestId, calculationMode, countryCode, configVersion, graphVersionId, graphChecksum, freshnessState, generatedAt]
      properties:
        requestId: { type: string }
        calculationMode: { type: string, enum: [synthetic_preview] }
        countryCode: { type: string }
        configVersion: { type: string }
        graphVersionId: { $ref: '#/components/schemas/OpaqueId' }
        graphChecksum: { type: string }
        freshnessState: { enum: [fresh, stale, expired] }
        generatedAt: { $ref: '#/components/schemas/UtcInstant' }
    PresenceCommand:
      type: object
      required: [state]
      properties:
        state: { enum: [active, stopped] }
        location: { $ref: '#/components/schemas/GeoPoint' }
        headingDegrees: { type: number, minimum: 0, maximum: 360 }
    Presence:
      type: object
      required: [rideId, userId, state, observedAt, expiresAt, evidence]
      properties:
        rideId: { $ref: '#/components/schemas/OpaqueId' }
        userId: { $ref: '#/components/schemas/OpaqueId' }
        state: { enum: [active, stale, stopped] }
        observedAt: { $ref: '#/components/schemas/UtcInstant' }
        expiresAt: { $ref: '#/components/schemas/UtcInstant' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        evidence: { enum: [device_reported, server_relayed] }
    ActivateSafetyIncidentCommand:
      type: object
      required: [activationMethod]
      properties:
        activationMethod: { enum: [hold_to_activate, accessibility_equivalent] }
        locationObservation: { $ref: '#/components/schemas/GeoPoint' }
    SafetyIncident:
      type: object
      required: [id, state, activatedAt, latestEvidence, country, version]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        state: { enum: [activating, active, stand_down_requested, resolved, cancelled] }
        activatedAt: { $ref: '#/components/schemas/UtcInstant' }
        latestEvidence: { enum: [local_recorded, server_accepted, provider_accepted, delivery_unknown, recipient_acknowledged, failed] }
        country: { $ref: '#/components/schemas/CountryContext' }
        version: { type: string }
    GeoSource:
      type: object
      required: [id, sourceName, sourceVersion, licenceReference, reviewState, receivedAt, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        sourceName: { type: string, minLength: 2, maxLength: 128 }
        sourceVersion: { type: string, minLength: 1, maxLength: 64 }
        licenceReference: { type: string, minLength: 1, maxLength: 256 }
        reviewState: { enum: [DRAFT, UNDER_REVIEW, APPROVED, REJECTED, SUPERSEDED] }
        receivedAt: { $ref: '#/components/schemas/UtcInstant' }
        publishedAt: { $ref: '#/components/schemas/UtcInstant' }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    CreateGeoSourceCommand:
      type: object
      required: [sourceName, sourceVersion, licenceReference]
      properties:
        sourceName: { type: string, minLength: 2, maxLength: 128 }
        sourceVersion: { type: string, minLength: 1, maxLength: 64 }
        licenceReference: { type: string, minLength: 1, maxLength: 256 }
    ReviewGeoSourceCommand:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus: { enum: [APPROVED, REJECTED] }
        reviewNotes: { type: string, maxLength: 512 }
    ReviewGeoDatasetCommand:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus: { enum: [APPROVED, REJECTED] }
        reviewNotes: { type: string, maxLength: 512 }
    GeoDataset:
      type: object
      required: [id, datasetType, sourceId, graphCoverageVersion, validFrom, freshUntil, checksum, reviewState, publishState, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        datasetType: { type: string, minLength: 2, maxLength: 64 }
        sourceId: { $ref: '#/components/schemas/OpaqueId' }
        graphCoverageVersion: { type: string, minLength: 1, maxLength: 64 }
        validFrom: { $ref: '#/components/schemas/UtcInstant' }
        freshUntil: { $ref: '#/components/schemas/UtcInstant' }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        reviewState: { enum: [DRAFT, UNDER_REVIEW, APPROVED, REJECTED, SUPERSEDED] }
        publishState: { enum: [UNPUBLISHED, PUBLISHED, ARCHIVED, DEPRECATED] }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    IngestGeoDatasetCommand:
      type: object
      required: [datasetType, sourceId, graphCoverageVersion, validFrom, freshUntil, checksum, boundaryWkt]
      properties:
        datasetType: { type: string, minLength: 2, maxLength: 64 }
        sourceId: { $ref: '#/components/schemas/OpaqueId' }
        graphCoverageVersion: { type: string, minLength: 1, maxLength: 64 }
        validFrom: { $ref: '#/components/schemas/UtcInstant' }
        freshUntil: { $ref: '#/components/schemas/UtcInstant' }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        boundaryWkt: { type: string, description: SRID 4326 Polygon/MultiPolygon WKT }
    GraphVersion:
      type: object
      required: [id, countryCode, configVersion, checksum, coverageReference, datasetIds, reviewState, publishState, validFrom, freshUntil, buildAt, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        configVersion: { type: string }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        coverageReference: { type: string }
        datasetIds: { type: array, items: { $ref: '#/components/schemas/OpaqueId' } }
        reviewState: { enum: [draft, reviewed, approved, rejected] }
        publishState: { enum: [unpublished, published, superseded, expired] }
        validFrom: { $ref: '#/components/schemas/UtcInstant' }
        freshUntil: { $ref: '#/components/schemas/UtcInstant' }
        buildAt: { $ref: '#/components/schemas/UtcInstant' }
        publishedAt: { $ref: '#/components/schemas/UtcInstant' }
        version: { type: string }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    CreateGraphVersionCommand:
      type: object
      required: [countryCode, configVersion, checksum, coverageReference, datasetIds, validFrom, freshUntil]
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        configVersion: { type: string }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        coverageReference: { type: string }
        datasetIds: { type: array, items: { $ref: '#/components/schemas/OpaqueId' } }
        validFrom: { $ref: '#/components/schemas/UtcInstant' }
        freshUntil: { $ref: '#/components/schemas/UtcInstant' }
        coverageBoundaryWkt: { type: string }
    QuarantineRecord:
      type: object
      required: [id, rejectionReason, rejectionCategory, rejectedAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        sourceId: { $ref: '#/components/schemas/OpaqueId' }
        datasetId: { $ref: '#/components/schemas/OpaqueId' }
        rejectionReason: { type: string }
        rejectionCategory: { type: string }
        rejectionMetadata: { type: object }
        rejectedAt: { $ref: '#/components/schemas/UtcInstant' }
        createdAt: { $ref: '#/components/schemas/UtcInstant' }
  responses:
    ApiError: { description: Safe API error, content: { application/json: { schema: { type: object, required: [error], properties: { error: { $ref: '#/components/schemas/ErrorBody' } } } } } }
    CurrentUser: { description: Current user profile, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/User' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    DeviceSessionResponse: { description: Device session registration result, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/DeviceSession' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    DeviceSessionList: { description: List of device sessions, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    ConsentList: { description: Consent receipts list, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/ConsentReceipt' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    ConsentReceipt: { description: Recorded consent receipt, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/ConsentReceipt' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    SafetyProfileResponse: { description: Safe safety profile summary, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/SafetyProfile' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    TripResponse: { description: Trip data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/Trip' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    GroupResponse: { description: Group data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/Group' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    GroupInviteResponse: { description: Group invite data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/GroupInvite' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    GroupMembershipResponse: { description: Group membership data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/GroupMembership' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    RideResponse: { description: Ride data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/Ride' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    GeoSourceResponse: { description: Geo source data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/GeoSource' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    GeoDatasetResponse: { description: Geo dataset data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/GeoDataset' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    GraphVersionResponse: { description: Graph version data and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/GraphVersion' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    QuarantineListResponse: { description: Quarantined records list and envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/QuarantineRecord' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    RouteCandidates: { description: Route candidates, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/RouteCandidate' } }, meta: { $ref: '#/components/schemas/RouteCandidatesMeta' } } } } } }
    Presence: { description: Presence, content: { application/json: { schema: { type: object } } } }
    PresenceList: { description: Presence list, content: { application/json: { schema: { type: object } } } }
    OfflinePackList: { description: Eligible offline packs, content: { application/json: { schema: { type: object } } } }
    DownloadIntent: { description: Scoped download intent, content: { application/json: { schema: { type: object } } } }
    SafetyIncident: { description: Safety incident, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/SafetyIncident' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    EffectiveConfiguration: { description: Effective safe configuration, content: { application/json: { schema: { type: object } } } }
